# A lineup is a mode plus a model per role. A role is a model string, or
# {model: ..., think: true|false} to force thinking on or off.
# max_attempts (default 3) is the number of graded attempts per problem; it
# must fit in the 20-call limit (team: at most 5).

# --- solo ---------------------------------------------------------------

haiku-solo:
  mode: solo
  roles: { solo: anthropic/claude-haiku-5-5 }

sonnet-solo:
  mode: solo
  roles: { solo: anthropic/claude-sonnet-5-5 }

opus-solo:
  mode: solo
  roles: { solo: anthropic/claude-opus-5-5 }

qwen14b-solo:
  mode: solo
  roles: { solo: ollama/qwen2.5-coder:14b }

gptoss-solo:
  mode: solo
  roles: { solo: ollama/gpt-oss:20b }

qwen36-solo:
  mode: solo
  roles: { solo: { model: "ollama/qwen3.6:35b-a3b", think: true } }

qwen36-nothink-solo:
  mode: solo
  roles: { solo: { model: "ollama/qwen3.6:35b-a3b", think: false } }

# --- team ---------------------------------------------------------------

sonnet-orch-qwen14b: &sonnet-orch-qwen14b
  mode: team
  roles:
    orchestrator: anthropic/claude-sonnet-5-5
    planner: anthropic/claude-sonnet-5-5
    coder: ollama/qwen2.5-coder:14b
    reviewer: ollama/qwen2.5-coder:14b

# Same team with two more attempts: does a replan pay off when the new plan
# gets more than one try? The merge key keeps the roles identical to the one above.
sonnet-orch-qwen14b-5att:
  <<: *sonnet-orch-qwen14b
  max_attempts: 5

all-local-gptoss:
  mode: team
  roles:
    orchestrator: ollama/gpt-oss:20b
    planner: ollama/gpt-oss:20b
    coder: ollama/gpt-oss:20b
    reviewer: ollama/gpt-oss:20b
