# A lineup is a plugin (plugin: ..., default code_bounty), a mode, and a model
# per role. A role is a model string, or {model: ..., think: true|false} to
# force thinking on or off. Unknown keys are an error.
# max_attempts (default 3) is the number of graded attempts per problem; it
# must fit in the 20-call limit (team: at most 5).

# --- solo ---------------------------------------------------------------

haiku-solo:
  mode: solo
  roles: { solo: anthropic/claude-haiku-5-5 }

sonnet-solo:
  mode: solo
  roles: { solo: anthropic/claude-sonnet-5-5 }

opus-solo:
  mode: solo
  roles: { solo: anthropic/claude-opus-5-5 }

qwen14b-solo:
  mode: solo
  roles: { solo: ollama/qwen2.5-coder:14b }

gptoss-solo:
  mode: solo
  roles: { solo: ollama/gpt-oss:20b }

qwen36-solo:
  mode: solo
  roles: { solo: { model: "ollama/qwen3.6:35b-a3b", think: true } }

qwen36-nothink-solo:
  mode: solo
  roles: { solo: { model: "ollama/qwen3.6:35b-a3b", think: false } }

# --- team ---------------------------------------------------------------

sonnet-orch-qwen14b: &sonnet-orch-qwen14b
  mode: team
  roles:
    orchestrator: anthropic/claude-sonnet-5-5
    planner: anthropic/claude-sonnet-5-5
    coder: ollama/qwen2.5-coder:14b
    reviewer: ollama/qwen2.5-coder:14b

# Same team with two more attempts: does a replan pay off when the new plan
# gets more than one try? The merge key keeps the roles identical to the one above.
sonnet-orch-qwen14b-5att:
  <<: *sonnet-orch-qwen14b
  max_attempts: 5

all-local-gptoss:
  mode: team
  roles:
    orchestrator: ollama/gpt-oss:20b
    planner: ollama/gpt-oss:20b
    coder: ollama/gpt-oss:20b
    reviewer: ollama/gpt-oss:20b

# --- mafia ----------------------------------------------------------------
# plugin: mafia. One task is a whole game; score 1.0 = town won. settings.players
# is 5-7 (default 7). At most one ollama model per lineup (one fits in VRAM).

mafia-haiku:
  plugin: mafia
  mode: game
  roles:
    narrator: anthropic/claude-haiku-5-5
    mafia: anthropic/claude-haiku-5-5
    detective: anthropic/claude-haiku-5-5
    villager: anthropic/claude-haiku-5-5

mafia-gptoss:
  plugin: mafia
  mode: game
  roles:
    narrator: ollama/gpt-oss:20b
    mafia: ollama/gpt-oss:20b
    detective: ollama/gpt-oss:20b
    villager: ollama/gpt-oss:20b

# Does a stronger model deceive better, or detect better? Same narrator in both.
mafia-sonnet-vs-haiku:
  plugin: mafia
  mode: game
  roles:
    narrator: anthropic/claude-haiku-5-5
    mafia: anthropic/claude-sonnet-5-5
    detective: anthropic/claude-haiku-5-5
    villager: anthropic/claude-haiku-5-5

mafia-haiku-vs-sonnet:
  plugin: mafia
  mode: game
  roles:
    narrator: anthropic/claude-haiku-5-5
    mafia: anthropic/claude-haiku-5-5
    detective: anthropic/claude-sonnet-5-5
    villager: anthropic/claude-sonnet-5-5

# All Sonnet players, the mirror for the Sonnet cells above. Haiku narrator like the other paid
# lineups (flavor only; players never see it).
mafia-sonnet:
  plugin: mafia
  mode: game
  roles:
    narrator: anthropic/claude-haiku-5-5
    mafia: anthropic/claude-sonnet-5-5
    detective: anthropic/claude-sonnet-5-5
    villager: anthropic/claude-sonnet-5-5

# gpt-oss against Haiku, each way: puts the free gpt-oss games against another model. Only the
# Haiku seats cost. One ollama model per lineup, so gpt-oss stays loaded all game.
mafia-gptoss-vs-haiku:
  plugin: mafia
  mode: game
  roles:
    narrator: anthropic/claude-haiku-5-5
    mafia: ollama/gpt-oss:20b
    detective: anthropic/claude-haiku-5-5
    villager: anthropic/claude-haiku-5-5

mafia-haiku-vs-gptoss:
  plugin: mafia
  mode: game
  roles:
    narrator: anthropic/claude-haiku-5-5
    mafia: anthropic/claude-haiku-5-5
    detective: ollama/gpt-oss:20b
    villager: ollama/gpt-oss:20b
