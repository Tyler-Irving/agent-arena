[project]
name = "agent-arena"
version = "0.1.0"
description = "Local orchestrator/worker multi-agent arena for comparing model lineups"
readme = "README.md"
authors = [
    { name = "Tyler Irving", email = "tyler.i.developer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "openai>=3.32.0",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
arena = "arena.cli:main"

[tool.uv.build-backend]
module-name = "arena"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
